<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · distracted · prodaktiv</title>
  <meta name="description" content="You opened a tab that doesn't exist. We logged it." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #fff;
      color: #111;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }

    .pd-404-page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px clamp(20px, 4vw, 48px);
    }

    .pd-404-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #888;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .pd-404-topbar strong { color: #111; font-weight: 700; }

    .pd-404-main {
      display: flex; flex-direction: column; justify-content: center;
      padding: 48px 0;
      gap: 28px;
    }

    .pd-404-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #888;
    }

    .pd-404-heading {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: clamp(48px, 9vw, 104px);
      line-height: 0.96;
      letter-spacing: -0.04em;
      color: #111;
      margin: 0;
    }

    .pd-404-callout {
      font-size: 18px;
      line-height: 1.55;
      color: #444;
      max-width: 56ch;
    }

    .pd-404-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #888;
    }

    .pd-404-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      border-bottom: 1px solid #111;
      padding-bottom: 2px;
      align-self: flex-start;
    }
    .pd-404-link:hover { color: #888; border-bottom-color: #888; }

    .pd-404-footer {
      border-top: 1px solid #e5e5e5;
      padding-top: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #aaa;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="pd-404-page">
    <div class="pd-404-topbar">
      <strong>prodaktiv</strong>
      <span>404 · route not found</span>
    </div>

    <main class="pd-404-main">
      <div class="pd-404-eyebrow">404</div>
      <h1 class="pd-404-heading">
        you opened a tab
        <br />
        that doesn&rsquo;t exist.
      </h1>
      <p class="pd-404-callout">
        we make a product that locks your phone so you can do deep work.
        and yet here you are. opening tabs. ones that don&rsquo;t even resolve.
      </p>
      <code class="pd-404-path" id="pd-path">/404</code>
      <a href="/" class="pd-404-link">← lock back in</a>
    </main>

    <div class="pd-404-footer">
      lock your phone. ship your work.
    </div>
  </div>

  <script>
    try {
      var p = window.location.pathname || '/404';
      if (p.length > 36) p = p.slice(0, 33) + '...';
      document.getElementById('pd-path').textContent = p;
    } catch (e) {}
  </script>
</body>
</html>
